# =========================
# Runner configuration file
# =========================

# --- Global simulation mode ---
magnetic_mode: antiferromagnetic

# --- Lattice configuration ---
lattice:
  type: bethe
  orbitals: 2
  hopping: 1.0

# --- Numerical parameters ---
numerical:
  beta: 8000.0
  tolerance: 1.0e-5
  integration_points: 3000
  mixing: 0.2
  max_iterations: 8000

# --- Interaction sweeps ---
sweep:
  # Sweep over Hubbard U
  u_interaction:
    start: 0.5
    stop: 3.0
    step: 0.25

  # Option A: fixed Hund coupling
  hund_coupling: 0.2

  # Option B (alternative): sweep Hund coupling instead
  # hund_coupling:
  #   start: 0.0
  #   stop: 0.5
  #   step: 0.05

# --- Optional solver initial guesses (legacy, soon to be deprecated) ---
solver_guesses:
  mu_guess: 0.0
  density_guess: 1.0
  z_guess: 1.0

  lambda_orbital_1_guess: 0.0
  lambda_orbital_2_guess: 0.0

  lambda_1_up_guess: -1.6
  lambda_1_down_guess: 1.6
  lambda_2_up_guess: -1.6
  lambda_2_down_guess: 1.6

  lambda_1_up_shift_guess: -3.16
  lambda_1_down_shift_guess: 3.16
  lambda_2_up_shift_guess: -3.16
  lambda_2_down_shift_guess: 3.16

# --- Orbital occupation ---
target_occupation: 2.0

# --- Output ---
output_path: results/custom_bethe_af_scan.dat
